[workspace]
members = [
    "crates/struo",
    "crates/struo-cli",
    "crates/struo-celox",
    "crates/struo-formal",
    "crates/struo-frontend-veryl",
    "crates/struo-ir",
    "crates/struo-rtl",
    "crates/struo-sim",
    "crates/struo-synth",
    "crates/struo-target-ecp5",
    "examples/axi4-smartconnect",
]
default-members = ["crates/struo-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
authors = ["Struo contributors"]

[workspace.dependencies]
struo = { version = "=0.1.0", path = "crates/struo" }
struo-celox = { version = "=0.1.0", path = "crates/struo-celox" }
struo-formal = { version = "=0.1.0", path = "crates/struo-formal" }
struo-frontend-veryl = { version = "=0.1.0", path = "crates/struo-frontend-veryl" }
struo-ir = { version = "=0.1.0", path = "crates/struo-ir" }
struo-rtl = { version = "=0.1.0", path = "crates/struo-rtl" }
struo-sim = { version = "=0.1.0", path = "crates/struo-sim" }
struo-synth = { version = "=0.1.0", path = "crates/struo-synth" }
struo-target-ecp5 = { version = "=0.1.0", path = "crates/struo-target-ecp5" }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test]
opt-level = 1
