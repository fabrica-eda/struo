<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Struo netlist viewer</title>
<style>
 :root { --bg:#14161a; --panel:#1d2026; --fg:#d8dbe2; --dim:#94a0b4;
         --acc:#7ab3ff; --route:#e0746c; --in:#69d0a8; --out:#e0915f;
         --ff:#d9b06a; --line:#3a404b; }
 * { box-sizing:border-box; }
 body { margin:0; background:var(--bg); color:var(--fg);
        font:13px/1.45 ui-monospace,Menlo,Consolas,monospace; height:100vh;
        display:flex; flex-direction:column; }
 header { display:flex; align-items:center; gap:12px; padding:7px 12px;
          border-bottom:1px solid var(--line); }
 .tab { cursor:pointer; padding:4px 11px; border-radius:5px; color:var(--dim); }
 .tab.active { background:#2b3a55; color:var(--acc); }
 #clockstat { margin-left:auto; color:var(--dim); }
 #body { flex:1; display:flex; min-height:0; }
 #tree { width:290px; overflow:auto; border-right:1px solid var(--line);
         padding:6px; }
 #view { flex:1; display:flex; flex-direction:column; min-width:0;
         min-height:0; }
 .pane { display:flex; flex-direction:column; height:100%; min-height:0; }
 .hidden { display:none !important; }
 #toolbar { padding:6px 10px; border-bottom:1px solid var(--line);
            display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
 #toolbar input, #toolbar select { background:#0e1013; color:var(--fg);
   border:1px solid var(--line); border-radius:4px; padding:3px 8px;
   font:inherit; }
 #canvaswrap { flex:1; overflow:auto; position:relative; }
 svg.fill { width:100%; height:100%; display:block; }
 #info { width:360px; overflow:auto; border-left:1px solid var(--line);
         padding:8px; font-size:12px; white-space:pre-wrap; }
 details { margin-left:10px; }
 summary { cursor:pointer; padding:1px 3px; border-radius:3px; list-style:none; }
 summary:hover { background:#262b33; }
 .counts { color:var(--dim); }
 svg text { fill:var(--fg); font:11px ui-monospace,monospace; }
 g.cell rect { fill:#22262b; stroke:#4a5260; rx:8; }
 g.cell.CCU2C rect { stroke:#b58fd0; }
 g.cell.FF rect { stroke:var(--ff); }
 g.cell.sel rect { stroke:var(--acc); stroke-width:2.5; }
 g.cell { cursor:pointer; }
 g.io-in rect { fill:#16301f; stroke:var(--in); stroke-width:1.4; }
 g.io-out rect { fill:#33241a; stroke:var(--out); stroke-width:1.4; }
 g.io-in text { fill:var(--in); }
 g.io-out text { fill:var(--out); }
 path.wire.hot { stroke:#7ab3ff !important; stroke-width:2.4 !important; }
</style>
</head>
<body>
<header>
  <span style="color:var(--acc)">struo viewer</span>
  <span class="tab active" data-tab="schematic">Schematic</span>
  <span class="tab" data-tab="timing">Timing</span>
  <span id="clockstat"></span>
</header>
<div id="body">
  <div id="tree"></div>
  <div id="view">
    <div id="pane-schematic" class="pane">
      <div id="toolbar">
        <select id="groupsel" style="min-width:300px"></select>
        <input id="cellsearch" placeholder="filter cells (substring)…"
               style="min-width:170px">
        <span id="sch-count" class="counts"></span>
        <span class="counts" style="margin-left:auto">
          inputs ◀ left · outputs ▶ right · wheel zoom · drag pan/cells
        </span>
      </div>
      <div id="canvaswrap"><svg id="sch-svg" class="fill"></svg></div>
    </div>
    <div id="pane-timing" class="pane hidden">
      <div style="flex:1; overflow:auto">
        <svg id="tim-svg" width="2400" height="1400"></svg>
      </div>
    </div>
  </div>
  <div id="info"></div>
</div>
<script>
"use strict";
const DATA = __DATA__;
const WIRES = DATA.connectivity || {};
const GROUPS = DATA.groups || {};
const UNASSIGNED = DATA.unassigned || [];
const TIMING = DATA.timing || {paths: [], clocks: {}};
const NS = "http://www.w3.org/2000/svg";
const SCHEM_CAP = 420;
const $ = id => document.getElementById(id);

function svgEl(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function div(parent, cls, text) {
  if (!parent) return null;
  const el = document.createElement("div");
  if (cls) el.className = cls;
  if (text !== undefined) el.textContent = text;
  parent.appendChild(el);
  return el;
}
function countText(node) {
  const c = node.cells || {LE:0, LUT4:0, CCU2C:0, FF:0};
  return `LE ${c.LE} | LUT ${c.LUT4} CCU ${c.CCU2C} FF ${c.FF}`;
}

/* ================= hierarchy ================= */
const TREE = DATA.tree;
let selectedPath = [];
let selectedNode = null;

function buildTree(parentEl, node, path) {
  const hasKids = (node.children || []).length > 0;
  const row = document.createElement(hasKids ? "details" : "div");
  row.style.marginLeft = hasKids ? "0" : "12px";
  const head = document.createElement(hasKids ? "summary" : "div");
  div(head, null, node.module);
  div(head, "counts", ` ${countText(node)} | wires ${node.internal_wires}`);
  head.addEventListener("click", () => {
    selectedPath = path.slice();
    selectedNode = node;
    const label = path.join("/");
    $("groupsel").value = GROUPS[label] ? label : "";
    schSelection = null;
    invalidateSchematic();
  });
  row.appendChild(head);
  const inner = document.createElement("div");
  row.appendChild(inner);
  for (const child of node.children || [])
    buildTree(inner, child, [...path, child.module]);
  parentEl.appendChild(row);
}

/* ================= connectivity index ================= */
let cellIndexCache = null;
function ensureCellIndex() {
  if (cellIndexCache) return cellIndexCache;
  cellIndexCache = {};
  for (const bit of Object.keys(WIRES)) {
    const w = WIRES[bit];
    const names = [];
    if (w.driver) names.push(w.driver.cell);
    for (const c of w.consumers || []) names.push(c.cell);
    for (const n of names) {
      const entry = (cellIndexCache[n] ||= {pins: []});
      entry.pins.push(bit);
    }
  }
  return cellIndexCache;
}

/* ================= schematic state ================= */
let schSelection = null;
let drawnKey = null;
let drawnSig = null;
let layoutCache = null;
let wireRegistry = [];
let worldEl = null;
let view = {k: 1, x: 40, y: 40};
let schFilter = "";

function schematicCellSet(groupLabel, filterText) {
  let names;
  if (groupLabel === "@unassigned") {
    names = UNASSIGNED.slice();
  } else if (groupLabel && GROUPS[groupLabel]) {
    names = GROUPS[groupLabel].slice();
  } else {
    const index = ensureCellIndex();
    names = Object.keys(index).filter(n => !n.includes("."));
  }
  if (filterText) names = names.filter(n => n.includes(filterText));
  return names;
}
function currentGroupKey() {
  return `${$("groupsel").value}|${schFilter}`;
}
function invalidateSchematic() {
  drawnKey = null;
  renderSchematic();
}

/* ================= info pane ================= */
function setInfo(lines) {
  const info = $("info");
  info.textContent = "";
  for (const [cls, text] of lines) div(info, cls, text);
}
function showCellInfo(name) {
  const lines = [["", `cell: ${name}`]];
  const entry = ensureCellIndex()[name];
  if (!entry) { setInfo(lines); return; }
  const seen = new Set();
  for (const bit of entry.pins) {
    const w = WIRES[bit];
    if (!w) continue;
    const label = w.name || `w${bit}`;
    if (w.driver && w.driver.cell !== name) {
      lines.push(["counts", `IN  ${label} <- ${w.driver.cell} (${w.driver.port})`]);
    }
    for (const c of w.consumers || []) {
      const key = `OUT ${label} -> ${c.cell}`;
      if (!seen.has(key)) {
        seen.add(key);
        lines.push(["counts", `OUT ${label} -> ${c.cell} (${c.port})`]);
      }
    }
  }
  setInfo(lines);
}
function showNetInfo(netKey) {
  const w = WIRES[netKey] || WIRES[String(netKey)];
  const lines = [["", `net: ${w && w.name ? w.name : netKey}`]];
  if (w) {
    if (w.driver) lines.push(["counts", `driver: ${w.driver.cell} (${w.driver.port})`]);
    for (const c of w.consumers || [])
      lines.push(["counts", `load: ${c.cell} (${c.port})`]);
  }
  setInfo(lines);
}

/* ================= groups selector ================= */
function populateGroups() {
  const sel = $("groupsel");
  sel.innerHTML = "";
  const entries = Object.entries(GROUPS).sort(
    ([, a], [, b]) => b.length - a.length
  );
  for (const [label, cells] of entries) {
    const opt = document.createElement("option");
    opt.value = label;
    opt.textContent = `${label} (${cells.length})`;
    sel.appendChild(opt);
  }
  if (UNASSIGNED.length) {
    const opt = document.createElement("option");
    opt.value = "@unassigned";
    opt.textContent = `(shared / unattributed) (${UNASSIGNED.length})`;
    sel.appendChild(opt);
  }
  sel.addEventListener("change", () => {
    schSelection = null;
    invalidateSchematic();
  });
  $("cellsearch").addEventListener("input", () => {
    schFilter = $("cellsearch").value.trim();
    invalidateSchematic();
  });
}

/* ================= layered left-to-right layout ================= */
function hashSeed(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}
function cellKind(name) {
  if (/ccu|arith|compare/i.test(name)) return "CCU2C";
  if (/^ff_|(^|[./_])ff/.test(name)) return "FF";
  return "LUT4";
}
function buildLayout(names) {
  const inSet = new Set(names);
  const nodes = names.map(name => ({
    name,
    kind: cellKind(name),
    col: 0,
    x: 0, y: 0,
  }));
  const byName = new Map(nodes.map(n => [n.name, n]));
  const outMap = new Map();   // srcName -> [dstNode]
  const indeg = new Map();    // dstName -> incoming edge count
  for (const bit of Object.keys(WIRES)) {
    const w = WIRES[bit];
    if (!w.driver || !inSet.has(w.driver.cell)) continue;
    const src = byName.get(w.driver.cell);
    if (!src) continue;
    for (const c of w.consumers || []) {
      const dst = byName.get(c.cell);
      if (!dst || dst === src) continue;
      const list = outMap.get(src.name) || [];
      list.push(dst);
      outMap.set(src.name, list);
      indeg.set(dst.name, (indeg.get(dst.name) || 0) + 1);
    }
  }

  // Longest-path layering over the acyclic visible subgraph (Kahn order).
  // Cells that neither feed nor read anything keep depth 0.
  const queue = nodes.filter(n => !indeg.get(n.name)).map(n => n.name);
  const depth = new Map(queue.map(n => [n, 0]));
  for (let head = 0; head < queue.length; head++) {
    const name = queue[head];
    const d = depth.get(name);
    for (const dst of outMap.get(name) || []) {
      indeg.set(dst.name, indeg.get(dst.name) - 1);
      if (!depth.has(dst.name) || depth.get(dst.name) < d + 1)
        depth.set(dst.name, d + 1);
      if (indeg.get(dst.name) === 0) queue.push(dst.name);
    }
  }
  // Anything stuck in a cycle or feeding nothing lands in column 0.
  for (const n of nodes)
    if (!depth.has(n.name)) depth.set(n.name, 0);
  for (const n of nodes) n.col = depth.get(n.name);

  return {nodes, byName, outMap};
}

function placeColumns(layout) {
  // Group nodes per layer, then two barycenter sweeps pull each cell toward
  // the mean y of its wired neighbors in the previous column so wires stay
  // short and crossings stay low.
  const columns = new Map();
  for (const n of layout.nodes) {
    if (!columns.has(n.col)) columns.set(n.col, []);
    columns.get(n.col).push(n);
  }
  const cols = [...columns.keys()].sort((a, b) => a - b);
  const ROWH = 58;

  for (const cidx of cols) {
    columns.get(cidx).sort((a, b) =>
      hashSeed(a.name) - hashSeed(b.name));
    columns.get(cidx).forEach((n, i) => { n.y = 80 + i * ROWH; });
  }

  const predsOf = name => {
    const result = [];
    for (const [srcName, dsts] of layout.outMap)
      if (dsts.includes(name))
        result.push(layout.byName.get(srcName));
    return result.filter(Boolean);
  };

  for (let pass = 0; pass < 2; pass++) {
    const order = pass % 2 === 0 ? cols : [...cols].reverse();
    for (const cidx of order) {
      const col = columns.get(cidx);
      for (const n of col) {
        const ys = predsOf(n.name)
          .filter(p => p.col === cidx - 1)
          .map(p => p.y);
        if (ys.length)
          n.y = ys.reduce((s, v) => s + v, 0) / ys.length;
      }
      col.sort((a, b) => a.y - b.y);
      col.forEach((n, i) => { n.y = 80 + i * ROWH; });
    }
  }

  let maxRows = 1;
  for (const [, col] of columns) maxRows = Math.max(maxRows, col.length);
  return {cols, ROWH, maxRows, columns};
}

/* ================= schematic drawing ================= */
function updateWirePath(pathEl, src, dst) {
  return () => {
    const dx = dst.x - src.x, dy = dst.y - src.y;
    const dd = Math.hypot(dx, dy) || 1;
    const x1 = src.x + (dx / dd) * 66;
    const y1 = src.y + (dy / dd) * 20;
    const x2 = dst.x - (dx / dd) * 66;
    const y2 = dst.y - (dy / dd) * 20;
    pathEl.setAttribute("d", `M ${x1} ${y1} L ${x2} ${y2}`);
  };
}

function attachDrag(g, node) {
  let dragging = false;
  g.addEventListener("pointerdown", ev => {
    dragging = true;
    ev.stopPropagation();
  });
  window.addEventListener("pointermove", ev => {
    if (!dragging) return;
    const rect = $("sch-svg").getBoundingClientRect();
    node.x = (ev.clientX - rect.left - view.x) / view.k;
    node.y = (ev.clientY - rect.top - view.y) / view.k;
    g.setAttribute("transform", `translate(${node.x},${node.y})`);
    for (const w of wireRegistry) w.pathEl.__update();
  });
  window.addEventListener("pointerup", () => { dragging = false; });
}

function applyView() {
  if (worldEl)
    worldEl.setAttribute("transform",
      `translate(${view.x},${view.y}) scale(${view.k})`);
}
function fitToContent() {
  if (!worldEl || !layoutCache) return;
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of layoutCache.nodes) {
    minX = Math.min(minX, n.x - 80); maxX = Math.max(maxX, n.x + 80);
    minY = Math.min(minY, n.y - 34); maxY = Math.max(maxY, n.y + 34);
  }
  const rect = $("sch-svg").getBoundingClientRect();
  const width = rect.width || 1600, height = rect.height || 900;
  const bw = maxX - minX, bh = maxY - minY;
  view.k = Math.min(2.2, Math.max(0.15, Math.min(width / bw, height / bh)));
  view.x = (width - bw * view.k) / 2 - minX * view.k;
  view.y = (height - bh * view.k) / 2 - minY * view.k;
  applyView();
}
(function wirePanZoom() {
  const svg = $("sch-svg");
  svg.addEventListener("wheel", ev => {
    ev.preventDefault();
    const rect = svg.getBoundingClientRect();
    const cx = ev.clientX - rect.left, cy = ev.clientY - rect.top;
    // scroll up = zoom in, scroll down = zoom out
    const factor = ev.deltaY > 0 ? 1 / 1.15 : 1.15;
    const k2 = Math.min(6, Math.max(0.12, view.k * factor));
    view.x = cx - (cx - view.x) * (k2 / view.k);
    view.y = cy - (cy - view.y) * (k2 / view.k);
    view.k = k2;
    applyView();
  }, {passive: false});
  let panning = null;
  svg.addEventListener("pointerdown", ev => {
    if (ev.target.closest && ev.target.closest("g.cell")) return;
    panning = {x: ev.clientX, y: ev.clientY, vx: view.x, vy: view.y};
  });
  window.addEventListener("pointermove", ev => {
    if (!panning) return;
    view.x = panning.vx + (ev.clientX - panning.x);
    view.y = panning.vy + (ev.clientY - panning.y);
    applyView();
  });
  window.addEventListener("pointerup", () => { panning = null; });
})();

function refreshSelection() {
  for (const w of wireRegistry) {
    const hot = schSelection != null &&
      (w.driverCell === schSelection || w.consumerCell === schSelection);
    w.pathEl.setAttribute("stroke", hot ? "#7ab3ff" : "#5c6675");
    w.pathEl.setAttribute("stroke-width", hot ? 2.4 : 1.3);
  }
  document.querySelectorAll("#sch-svg g.cell").forEach(g => {
    g.classList.toggle("sel", g.dataset.name === schSelection);
  });
}
function showCellInfo(name) {
  const lines = [["", `cell: ${name}`]];
  const entry = ensureCellIndex()[name];
  if (!entry) { setInfo(lines); return; }
  const seen = new Set();
  for (const bit of entry.pins) {
    const w = WIRES[bit];
    if (!w) continue;
    const label = w.name || `w${bit}`;
    if (w.driver && w.driver.cell !== name) {
      lines.push(["counts", `IN  ${label} <- ${w.driver.cell} (${w.driver.port})`]);
    }
    for (const c of w.consumers || []) {
      const key = `OUT ${label} -> ${c.cell}`;
      if (!seen.has(key)) {
        seen.add(key);
        lines.push(["counts", `OUT ${label} -> ${c.cell} (${c.port})`]);
      }
    }
  }
  setInfo(lines);
}

/* ================= schematic drawing ================= */
function renderSchematic() {
  const key = `${$("groupsel").value}|${schFilter}`;
  const allNames = schematicCellSet($("groupsel").value, schFilter);
  const shown = allNames;

  const svg = $("sch-svg");
  svg.innerHTML = "";

  const header = svgEl("text", {x: 16, y: 24}, svg);
  header.textContent =
    `schematic: ${$("groupsel").value || "(top direct)"} — ${shown.length} cells`;
  $("sch-count").textContent = `${shown.length} cells`;

  if (!shown.length) {
    svgEl("text", {x: 16, y: 56, fill:"#e0746c"}, svg)
      .textContent = "no cells match";
    return;
  }

  if (drawnKey !== key) {
    const layout = buildLayout(shown);
    placeColumns(layout);
    layout.key = key;
    layoutCache = layout;
    drawnKey = key;
  }
  const layout = layoutCache;

  worldEl = svgEl("g", {}, svg);

  /* ---- pass 1: collect pins per cell ---- */
  const cellPinMap = new Map();   // cellName -> {inPins: [], outPins: []}
  function getPinEntry(name) {
    let e = cellPinMap.get(name);
    if (!e) { e = {inPins: [], outPins: []}; cellPinMap.set(name, e); }
    return e;
  }

  const wireDefs = [];
  for (const bit of Object.keys(WIRES)) {
    const w = WIRES[bit];
    if (!w.driver) continue;
    const src = layout.byName.get(w.driver.cell);
    if (!src) continue;
    const label = w.name || `w${bit}`;
    for (const c of w.consumers || []) {
      const dst = layout.byName.get(c.cell);
      if (!dst) continue;
      wireDefs.push({bit, label, srcName: w.driver.cell, dstName: c.cell,
                     srcNode: src, dstNode: dst});
      getPinEntry(w.driver.cell).outPins.push({bit, label, peer: c.cell});
      getPinEntry(c.cell).inPins.push({bit, label, peer: w.driver.cell});
    }
  }

  /* ---- pass 2: assign pin positions on box edges ---- */
  const PIN_R = 4, PIN_GAP = 8;
  function assignSidePins(pins, edgeX, sideSign, boxH) {
    const usable = boxH - 2 * PIN_GAP;
    const step = pins.length > 1 ? usable / (pins.length - 1) : 0;
    const start = -boxH / 2 + PIN_GAP;
    pins.forEach((p, i) => {
      p.dx = edgeX;
      p.dy = start + i * step;
    });
  }

  const nodeEntries = new Map();
  for (const node of layout.nodes) {
    const entry = cellPinMap.get(node.name) || {inPins: [], outPins: []};
    assignSidePins(entry.inPins, -66, -1, 40);
    assignSidePins(entry.outPins, +66, +1, 40);
    nodeEntries.set(node.name, entry);
  }

  /* ---- pass 3: draw wires under boxes ---- */
  wireRegistry = [];
  for (const def of wireDefs) {
    const srcEntry = nodeEntries.get(def.srcName);
    const dstEntry = nodeEntries.get(def.dstName);
    if (!srcEntry || !dstEntry) continue;

    const srcOut = srcEntry.outPins.find(p => p.bit === def.bit && p.peer === def.dstName)
                || srcEntry.outPins[0];
    const dstIn = dstEntry.inPins.find(p => p.bit === def.bit)
               || dstEntry.inPins[0];
    if (!srcOut || !dstIn) continue;

    const x1 = def.srcNode.x + srcOut.dx;
    const y1 = def.srcNode.y + srcOut.dy;
    const x2 = def.dstNode.x + dstIn.dx;
    const y2 = def.dstNode.y + dstIn.dy;
    const mx = (x1 + x2) / 2;

    const pathEl = svgEl("path", {
      class: "wire",
      stroke: "#5c6675",
      "stroke-width": 1.3,
      fill: "none",
    }, worldEl);
    pathEl.setAttribute("d",
      `M ${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}`);
    pathEl.addEventListener("click", ev => {
      ev.stopPropagation();
      showNetInfo(def.bit, def.label);
    });
    wireRegistry.push({pathEl, driverCell: def.srcName,
                       consumerCells: [def.dstName], label: def.label});
  }

  /* ---- pass 4: draw cells with pin circles ---- */
  for (const node of layout.nodes) {
    const g = svgEl("g", {class: `cell ${node.kind}`}, worldEl);
    g.dataset.name = node.name;
    svgEl("rect", {x: -66, y: -20, width: 132, height: 40, rx: 8}, g);
    const short = node.name.length > 21 ? node.name.slice(0, 20) + "…" : node.name;
    svgEl("text", {x: -58, y: -2}, g).textContent = short;
    svgEl("text", {x: -58, y: 13, fill: "#8b93a1"}, g).textContent = node.kind;

    const entry = nodeEntries.get(node.name);
    if (entry) {
      for (const p of entry.inPins) {
        svgEl("circle", {cx: -66, cy: p.dy, r: PIN_R,
                         fill: "#69d0a8", class: "pin-in"}, g);
      }
      for (const p of entry.outPins) {
        svgEl("circle", {cx: +66, cy: p.dy, r: PIN_R,
                         fill: "#e0915f", class: "pin-out"}, g);
      }
    }

    g.setAttribute("transform", `translate(${node.x},${node.y})`);
    g.addEventListener("click", ev => {
      ev.stopPropagation();
      schSelection = schSelection === node.name ? null : node.name;
      refreshSelection();
      showCellInfo(node.name);
    });
    attachDrag(g, node);
  }

  applyView();
  fitToContent();
  refreshSelection();
}

function showNetInfo(bit, label) {
  const w = WIRES[String(bit)];
  const lines = [["", `net: ${label}`]];
  if (!w) { setInfo(lines); return; }
  if (w.driver) lines.push(["counts", `driver: ${w.driver.cell} (${w.driver.port})`]);
  for (const c of w.consumers || [])
    lines.push(["counts", `load: ${c.cell} (${c.port})`]);
  setInfo(lines);
}

/* ================= IO columns ================= */
// Module-boundary IO: nets entering from outside sit in a green column on
// the left; nets leaving to outside sit in an orange column on the right,
// so signal flow reads left-to-right along the layers.
function drawIoColumns(layout, parent) {
  const visible = new Set(layout.nodes.map(n => n.name));
  const inNets = [];
  const outNets = [];
  for (const bit of Object.keys(WIRES)) {
    const w = WIRES[bit];
    if (!w.driver) continue;
    const srcVisible = visible.has(w.driver.cell);
    const sinksAll = w.consumers || [];
    const insideSinks = sinksAll.filter(c => visible.has(c.cell));
    const label = w.name || `w${bit}`;
    if (!srcVisible && insideSinks.length) {
      inNets.push({
        label,
        targets: insideSinks.map(c => layout.byName.get(c.cell)),
      });
    } else if (srcVisible && insideSinks.length < sinksAll.length) {
      outNets.push({label, source: layout.byName.get(w.driver.cell)});
    }
  }
  if (!inNets.length && !outNets.length) return;

  let minX = Infinity, maxX = -Infinity;
  let minY = Infinity, maxY = -Infinity;
  for (const n of layout.nodes) {
    minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x);
    minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y);
  }

  function drawColumn(nets, x, cls) {
    const BOXW = 128, LINEH = 15;
    const shownNets = nets.slice(0, 16);
    const h = 30 + shownNets.length * LINEH;
    const y = (minY + maxY) / 2 - h / 2;
    const g = svgEl("g", {class: cls}, parent);
    svgEl("rect", {x: x - BOXW / 2, y, width: BOXW, height: h, rx: 8}, g);
    svgEl("text", {x, y: y + 18, "text-anchor": "middle",
                   "font-size": "11px"}, g).textContent =
      `${cls === "io-in" ? "inputs" : "outputs"} (${nets.length})`;
    shownNets.forEach((net, i) => {
      svgEl("text", {x: x - BOXW / 2 + 8, y: y + 34 + i * LINEH,
                     "font-size": "10px", fill: "#8b93a1"}, g)
        .textContent = net.label.slice(0, 18);
    });
    void x;
    return {x, top: y, bottom: y + h};
  }
  const inCol = drawColumn(inNets, minX - 110, "io-in");
  const outCol = drawColumn(outNets, maxX + 110, "io-out");

  // stub wires from each column edge toward its nearest endpoint so the
  // direction of flow stays visible at a glance.
  function stub(net, side, i, count) {
    const isInput = side === "in";
    const spread = (i - (count - 1) / 2) * 14;
    if (isInput) {
      for (const t of net.targets) {
        svgEl("path", {
          d: `M ${inCol.x + 64} ${t.y} L ${t.x - 66} ${t.y}`,
          stroke: "#69d0a8", "stroke-opacity": 0.55,
          "stroke-width": 1.2, fill: "none",
        }, parent);
      }
    } else {
      for (const s of net.sources || []) {
        svgEl("path", {
          d: `M ${s.x + 66} ${s.y} L ${outCol.x - 64} ${s.y}`,
          stroke: "#e0915f", "stroke-opacity": 0.55,
          "stroke-width": 1.2, fill: "none",
        }, parent);
      }
    }
    void spread;
  }
  inNets.forEach((net, i) => stub(net, "in", i, inNets.length));
  outNets.forEach((net, i) => stub(net, "out", i, outNets.length));
}

/* ================= timing view ================= */
function renderTiming() {
  const svg = $("tim-svg");
  svg.innerHTML = "";
  svgEl("defs", {}, svg).innerHTML =
    '<marker id="arrow-t" markerWidth="9" markerHeight="9" refX="8" refY="4.5"' +
    ' orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#e0746c"/></marker>';
  const clocks = Object.entries(TIMING.clocks || {});
  svgEl("text", {x: 18, y: 26}, svg).textContent =
    "achieved Fmax: " + (clocks.map(([n, v]) => `${v} MHz`).join(", ") || "n/a");
  if (!TIMING.paths.length) {
    svgEl("text", {x: 18, y: 56, fill:"#e0746c"}, svg)
      .textContent = "no critical paths embedded — regenerate with --report";
    return;
  }
  let top = 56;
  let widest = 0;
  TIMING.paths.forEach((p, pi) => {
    svgEl("text", {x: 18, y: top}, svg)
      .textContent = `path ${pi+1}: total ${p.total_ps} ps — from ${p.start}`;
    top += 24;
    const items = [];
    for (const step of p.steps) {
      if ("net" in step) {
        if (items.length && items[items.length-1].kind === "wire") {
          items[items.length-1].ps += step.delay_ps;
          items[items.length-1].net = step.net;
        } else {
          items.push({kind:"wire", ps:step.delay_ps, net:step.net});
        }
      } else if (items.length && items[items.length-1].kind === "cell"
                 && items[items.length-1].cell === step.cell) {
        items[items.length-1].ps += step.delay_ps;
      } else {
        items.push({kind:"cell", cell:step.cell, ps:step.delay_ps});
      }
    }
    while (items.length && items[0].kind === "wire") items.shift();
    while (items.length && items[items.length-1].kind === "wire") items.pop();

    const BOXW = 168, BOXH = 50, WIREW = 116;
    let x = 24;
    const cy = top + BOXH/2 + 4;
    items.forEach(item => {
      if (item.kind === "cell") {
        const g = svgEl("g", {class:"cell"}, svg);
        svgEl("rect", {x, y: top + 4, width: BOXW, height: BOXH}, g);
        const short = item.cell.length > 21 ? item.cell.slice(0,20)+"…" : item.cell;
        svgEl("text", {x: x+9, y: top+20}, g).textContent = short;
        svgEl("text", {x: x+9, y: top+38, fill:"#8b93a1"}, g)
          .textContent = `${item.ps} ps`;
        x += BOXW;
      } else {
        const y0 = cy;
        svgEl("path", {d:`M ${x} ${y0} L ${x+WIREW-14} ${y0}`,
                       stroke:"#e0746c", "stroke-width":3,
                       "marker-end":"url(#arrow-t)"}, svg);
        svgEl("text", {x: x+4, y: y0-9, fill:"#e0746c"}, svg)
          .textContent = `${item.ps} ps · ${item.net}`;
        x += WIREW;
      }
    });
    widest = Math.max(widest, x + 60);
    top += BOXH + 52;
  });
  svg.setAttribute("width", widest + 40);
}

/* ================= tabs ================= */
function setTab(name) {
  for (const tab of document.querySelectorAll("header .tab"))
    tab.classList.toggle("active", tab.dataset.tab === name);
  $("pane-schematic").classList.toggle("hidden", name !== "schematic");
  $("pane-timing").classList.toggle("hidden", name !== "timing");
  if (name === "timing") renderTiming();
  if (name === "schematic") invalidateSchematic();
}
for (const tab of document.querySelectorAll("header .tab"))
  tab.addEventListener("click", () => setTab(tab.dataset.tab));
window.addEventListener("error", event => {
  const bar = document.createElement("div");
  bar.style.cssText =
    "position:fixed;bottom:0;left:0;right:0;background:#5a1e1e;color:#ffd9d9;" +
    "padding:6px 12px;font:12px monospace;z-index:99";
  bar.textContent = "viewer error: " + event.message + " @ line " + event.lineno;
  document.body.appendChild(bar);
});

/* ================= groups selector ================= */
function populateGroups() {
  const sel = $("groupsel");
  sel.innerHTML = "";
  const entries = Object.entries(GROUPS).sort(
    ([, a], [, b]) => b.length - a.length
  );
  for (const [label, cells] of entries) {
    const opt = document.createElement("option");
    opt.value = label;
    opt.textContent = `${label} (${cells.length})`;
    sel.appendChild(opt);
  }
  if (UNASSIGNED.length) {
    const opt = document.createElement("option");
    opt.value = "@unassigned";
    opt.textContent = `(shared / unattributed) (${UNASSIGNED.length})`;
    sel.appendChild(opt);
  }
  sel.addEventListener("change", () => {
    schSelection = null;
    invalidateSchematic();
  });
  $("cellsearch").addEventListener("input", () => {
    schFilter = $("cellsearch").value.trim();
    invalidateSchematic();
  });
}

/* ================= boot ================= */
buildTree($("tree"), TREE, []);
populateGroups();
setTab("schematic");
</script>
