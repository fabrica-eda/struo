name: Publish Rust Crates

on:
  workflow_dispatch:

concurrency:
  group: crates-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Check release tag and version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" || ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run this workflow from a v-prefixed stable release tag." >&2
            exit 1
          fi
          expected_tag="v$(tr -d '\r\n' < VERSION)"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match VERSION ($expected_tag)." >&2
            exit 1
          fi

      - name: Check published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          published_tag="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json tagName,isDraft,isPrerelease \
              --jq 'select(.isDraft == false and .isPrerelease == false) | .tagName'
          )"
          if [[ "$published_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Published GitHub Release $GITHUB_REF_NAME was not found." >&2
            exit 1
          fi

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Check synchronized release versions
        run: ./scripts/check-release-version.py

  package:
    name: Package and test
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Validate every public package
        run: ./scripts/publish-crates.sh package

      - name: Run workspace tests
        run: cargo test --locked --workspace --all-targets

      - name: Build public API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: >-
          cargo doc --locked --workspace --no-deps
          --exclude struo-cli
          --exclude struo-example-axi4-smartconnect

  publish:
    name: Publish to crates.io
    needs: [validate, package]
    runs-on: ubuntu-24.04
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Authenticate to crates.io
        id: crates_io_auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates_io_auth.outputs.token }}
        run: ./scripts/publish-crates.sh publish
