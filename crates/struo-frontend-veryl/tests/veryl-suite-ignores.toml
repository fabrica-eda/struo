# These oracles require behavior outside Struo's synthesis contract.
# --include-ignored executes them too, retaining upstream tag metadata.
[[exclude_tag]]
tag = "deferred_function_effects"
reason = "Celox-specific deferred function copy-out in FFs; Struo retains the Veryl always_ff function-effect restriction."

[[exclude_tag]]
tag = "eager_assertion_messages"
reason = "Successful assertions do not execute failure-message effects; do not synthesize the suite's eager-message policy."

[[exclude_tag]]
tag = "two_state_initialization"
reason = "Synthesis does not promise zero initialization of four-state storage or retain constant FFs to provide it."

