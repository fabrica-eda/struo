[package]
name = "struo-cli"
description = "Command-line interface for Struo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "struo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
struo.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
struo-example-axi4-smartconnect = { path = "../../examples/axi4-smartconnect" }

[lints]
workspace = true
